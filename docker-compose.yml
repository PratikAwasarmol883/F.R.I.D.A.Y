x-friday-env: &friday-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
  DAILY_TOKEN_BUDGET: ${DAILY_TOKEN_BUDGET:-200000}
  SEARCH_API_KEY: ${SEARCH_API_KEY:-}
  ENABLED_TOOLS: ${ENABLED_TOOLS:-web_search,web_fetch,remember}
  MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
  MEMORY_IN_PROMPT: ${MEMORY_IN_PROMPT:-true}
  MEMORY_MAX_NOTES: ${MEMORY_MAX_NOTES:-200}
  MEMORY_MAX_PENDING: ${MEMORY_MAX_PENDING:-20}
  MAX_SCHEDULES_PER_USER: ${MAX_SCHEDULES_PER_USER:-10}
  SCHEDULE_GRACE_SECONDS: ${SCHEDULE_GRACE_SECONDS:-3600}
  SCHEDULER_BATCH: ${SCHEDULER_BATCH:-20}
  SPEECH_API_KEY: ${SPEECH_API_KEY:-}
  SPEECH_BASE_URL: ${SPEECH_BASE_URL:-https://api.openai.com/v1}
  STT_MODEL: ${STT_MODEL:-whisper-1}
  TTS_MODEL: ${TTS_MODEL:-gpt-4o-mini-tts}
  TTS_VOICE: ${TTS_VOICE:-alloy}
  VOICE_MAX_UPLOAD_BYTES: ${VOICE_MAX_UPLOAD_BYTES:-6000000}
  VOICE_DAILY_LIMIT: ${VOICE_DAILY_LIMIT:-100}
  VOICE_TTS_MAX_CHARS: ${VOICE_TTS_MAX_CHARS:-1500}
  VOICE_TIMEOUT_SECONDS: ${VOICE_TIMEOUT_SECONDS:-30}
  FETCH_TIMEOUT_SECONDS: ${FETCH_TIMEOUT_SECONDS:-10}
  FETCH_DAILY_LIMIT: ${FETCH_DAILY_LIMIT:-100}
  RESEARCH_MAX_SEARCHES: ${RESEARCH_MAX_SEARCHES:-3}
  RESEARCH_MAX_SOURCES: ${RESEARCH_MAX_SOURCES:-5}
  RESEARCH_MAX_OUTPUT_TOKENS: ${RESEARCH_MAX_OUTPUT_TOKENS:-3000}
  RESEARCH_DEADLINE_SECONDS: ${RESEARCH_DEADLINE_SECONDS:-240}
  MAX_ACTIVE_TASKS_PER_USER: ${MAX_ACTIVE_TASKS_PER_USER:-5}
  TASK_WORKER_CONCURRENCY: ${TASK_WORKER_CONCURRENCY:-2}
  TASK_POLL_INTERVAL_SECONDS: ${TASK_POLL_INTERVAL_SECONDS:-2}
  TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-60}
  TASK_HEARTBEAT_SECONDS: ${TASK_HEARTBEAT_SECONDS:-10}
  TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
  TASK_MAX_RUNTIME_SECONDS: ${TASK_MAX_RUNTIME_SECONDS:-300}
  TASK_RETRY_BASE_SECONDS: ${TASK_RETRY_BASE_SECONDS:-5}
  TASK_RETRY_MAX_SECONDS: ${TASK_RETRY_MAX_SECONDS:-120}
  TASK_RETENTION_DAYS: ${TASK_RETENTION_DAYS:-30}
  TASK_SHUTDOWN_GRACE_SECONDS: ${TASK_SHUTDOWN_GRACE_SECONDS:-30}
  DATABASE_URL: postgresql://${POSTGRES_USER:-friday_user}:${POSTGRES_PASSWORD:-friday_password}@friday-db:5432/${POSTGRES_DB:-friday_db}

services:
  friday-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friday_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-friday_password}
      POSTGRES_DB: ${POSTGRES_DB:-friday_db}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - friday-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  friday-api:
    build: .
    environment: *friday-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      friday-db:
        condition: service_healthy

  friday-worker:
    build: .
    command: ["python", "-m", "friday.worker"]
    environment: *friday-env
    depends_on:
      friday-db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s  # longer than TASK_SHUTDOWN_GRACE_SECONDS so tasks can finish or release
    healthcheck:
      disable: true  # the image's HTTP healthcheck is for the API only

volumes:
  friday-postgres-data:
