[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-client"
version = "0.1.0"
description = "FRIDAY voice client for macOS"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
mac = ["sounddevice>=0.4", "keyring>=24"]

[project.scripts]
friday-client = "friday_client.__main__:main"

[tool.setuptools.packages.find]
include = ["friday_client*"]
