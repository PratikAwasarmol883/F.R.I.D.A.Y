name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: friday_user
          POSTGRES_PASSWORD: friday_password
          POSTGRES_DB: friday_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U friday_user -d friday_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://friday_user:friday_password@localhost:5433/friday_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check friday tests migrations
      - run: ruff format --check friday tests migrations
      - run: mypy friday
      - run: pytest
      - name: Migrations apply cleanly (up, down, up)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
